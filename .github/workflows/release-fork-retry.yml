name: Release (fork) retry

# Hosted macOS jobs that never receive a runner are cancelled after about 15
# minutes, and the release run fails before those builds start. Re-run the
# whole run once when that is the only problem. Re-running only the failed
# jobs startup-fails for this workflow: those jobs are cancelled, not failed.
# A job that started is left failed. workflow_run reads this file from the
# default branch.

on:
  workflow_run:
    workflows: ["Release (fork)"]
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: read

jobs:
  retry:
    name: Re-run unacquired macOS jobs
    if: >-
      github.repository_owner != 'pingdotgg' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 2
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/scripts/retry-macos-runner.cjs
          sparse-checkout-cone-mode: false

      - name: Re-run macOS jobs that never started
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          retries: 3
          script: |
            const { macosLegsToRetry } = require("./.github/scripts/retry-macos-runner.cjs");
            const runId = context.payload.workflow_run.id;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo,
              run_id: runId,
              per_page: 100,
            });
            const annotated = [];
            for (const job of jobs) {
              if (job.conclusion !== "cancelled" || (job.steps ?? []).length !== 0) {
                annotated.push(job);
                continue;
              }
              const annotations = await github.paginate(github.rest.checks.listAnnotations, {
                ...context.repo,
                check_run_id: job.id,
                per_page: 100,
              });
              annotated.push({ ...job, annotations });
            }
            const decision = macosLegsToRetry(annotated);
            if (decision.blockedBy || decision.labels.length === 0) {
              core.notice(
                decision.blockedBy
                  ? `Not re-running: ${decision.blockedBy} did not match an unacquired macOS build.`
                  : "No macOS build was dropped before it started.",
              );
              return;
            }
            core.notice(
              `Re-running the release. macOS builds that never got a runner: ${decision.labels.join(", ")}`,
            );
            await github.rest.actions.reRunWorkflow({
              ...context.repo,
              run_id: runId,
            });
